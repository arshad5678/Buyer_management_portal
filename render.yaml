services:
  - type: web
    name: buyer-management-portal-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        generateValue: false
      # Set these in the Render dashboard — do not commit real values:
      # CLIENT_URL, JWT_SECRET, JWT_EXPIRES_IN, REFRESH_TOKEN_EXPIRES_IN,
      # SESSION_IDLE_TIMEOUT, DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME
    healthCheckPath: /api/health
